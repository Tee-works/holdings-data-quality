[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "holdings-data-quality"
version = "0.1.0"
description = "SQL data quality controls on public SEC Form 13F holdings filings, with an issue log, SLAs and a live dashboard."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6",
    "jinja2>=3.1",
    "requests>=2.31",
    "numpy>=1.26",
    "lxml>=5",
    # Load reconciliation (document vs warehouse) runs on TrueSet, the author's open-source library.
    "trueset @ git+https://github.com/trueset-dev/trueset@9cfb61c6a4617b87f5a293d819e262638bb6a462",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3", "sqlglot>=25"]
snowflake = ["snowflake-connector-python[pandas]>=3.12,<5"]

[project.scripts]
hdq = "hdq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
